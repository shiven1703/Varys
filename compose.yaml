x-varys-image: &varys-image
  image: varys:local
  build:
    context: .
    dockerfile: docker/Dockerfile

services:
  app:
    <<: *varys-image
    command: ["docker/entrypoints/app.sh"]
    environment:
      VARYS_API_HOST: 0.0.0.0
      VARYS_DATABASE_URL: postgresql+psycopg://varys:${VARYS_POSTGRES_PASSWORD:?Set VARYS_POSTGRES_PASSWORD in .env}@postgres:5432/varys
      VARYS_DATA_ROOT: /data
      VARYS_SESSION_SECRET: ${VARYS_SESSION_SECRET:?Set VARYS_SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - varys-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - edge
      - database

  worker:
    image: varys:local
    command: ["docker/entrypoints/worker.sh"]
    environment:
      VARYS_DATABASE_URL: postgresql+psycopg://varys:${VARYS_POSTGRES_PASSWORD:?Set VARYS_POSTGRES_PASSWORD in .env}@postgres:5432/varys
      VARYS_DATA_ROOT: /data
      VARYS_SESSION_SECRET: ${VARYS_SESSION_SECRET:?Set VARYS_SESSION_SECRET in .env}
    volumes:
      - varys-data:/data
    depends_on:
      app:
        condition: service_healthy
    networks:
      - database

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: varys
      POSTGRES_PASSWORD: ${VARYS_POSTGRES_PASSWORD:?Set VARYS_POSTGRES_PASSWORD in .env}
      POSTGRES_USER: varys
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varys -d varys"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - database

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["cloudflared"]
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

networks:
  edge:
  database:
    internal: true

volumes:
  postgres-data:
  varys-data:
