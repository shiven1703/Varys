[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "varys"
version = "0.0.0"
description = "Varys market-data preparation application"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["backend/tests"]
strict = true
warn_unused_configs = true
