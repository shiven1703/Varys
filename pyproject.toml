[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "varys"
version = "0.0.0"
description = "Varys market-data preparation application"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = [
  "alembic==1.14.1",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==9.0.3",
  "ruff==0.9.10",
  "SQLAlchemy==2.0.38",
  "uvicorn==0.34.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["-ra"]
markers = ["integration: requires a PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["backend/varys", "backend/tests"]
strict = true
warn_unused_configs = true
