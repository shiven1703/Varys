name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: make bootstrap
      - run: make format
      - run: git diff --exit-code
      - run: make check
      - run: make test-golden
      - run: make test-integration
      - run: make test-failure-injection

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test -- --watch=false

  e2e:
    runs-on: ubuntu-24.04
    env:
      VARYS_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: make test-e2e
      - if: always()
        run: docker compose down --volumes --remove-orphans

  compose-smoke:
    runs-on: ubuntu-24.04
    env:
      VARYS_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: make compose-smoke

  image-scan:
    runs-on: ubuntu-24.04
    env:
      VARYS_POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: varys:local
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  dependency-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit --requirement requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend audit --omit=dev
