name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make bootstrap
      - run: make format
      - run: git diff --exit-code
      - run: make check
      - run: make test-golden
      - run: make test-integration
      - run: make test-failure-injection
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test -- --watch=false
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: make compose-smoke
        env:
          VARYS_POSTGRES_PASSWORD: ci-only-password
          VARYS_SESSION_SECRET: ci-only-session-secret-for-compose-smoke-tests-2026
          VARYS_RUN_E2E: '1'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: varys:local
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit --requirement requirements-dev.lock
      - run: npm --prefix frontend audit --omit=dev
